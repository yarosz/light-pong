[tools]
java = "temurin-17"
android-sdk = "23.0"

[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Library/Android/sdk"
# The Pong emulator, selected by AVD name (scripts/pong-emu.sh) on its own port. Never another Tool's emulator.
PONG_AVD = "LightPhone3-pong"
_.path = [
  "{{env.HOME}}/Library/Android/sdk/emulator",
  "{{env.HOME}}/Library/Android/sdk/platform-tools",
]

[tasks.emu]
description = "Boot the LightPhone3-pong AVD on emulator-5560 (writable system and public DNS, every boot; scripts/emulator/RECIPE.md)"
run = [
  "emulator -avd $PONG_AVD -port 5560 -writable-system -no-snapshot -no-boot-anim -dns-server 1.1.1.1,8.8.8.8",
]

[tasks.tool]
description = "Build (for the emulator's LightOS app), install, and launch on the Pong emulator (emulator-5560)"
run = [
  "scripts/emulator-build.sh ./gradlew :tool:assembleDebug",
  "scripts/pong-emu.sh install -r tool/build/outputs/apk/debug/tool-debug.apk",
  "scripts/pong-emu.sh shell monkey -p com.yarosz.pong 1",
]

[tasks.lightos]
description = "Rebuild + reinstall the LightOS emulator system app on the Pong emulator (keeps uid 1000)"
run = [
  "./gradlew :sdk:emulator:assembleDebug",
  "scripts/pong-emu.sh install -r light-sdk/sdk/emulator/build/outputs/apk/debug/emulator-debug.apk",
]

[tasks.ci]
description = "Local CI: tests, Light-builder simulation, emulator round trip on the Pong AVD; posts signoff statuses"
run = "scripts/ci.sh"

[tasks.bench]
description = "Frame benchmark on a device: install the benchmark build (30 s Rally at the speed cap), print PongPerf P50/P90 (arg: adb serial)"
usage = '''
arg "<serial>" help="adb serial of the device (required)"
'''
run = 'scripts/bench.sh "$usage_serial"'

[tasks.domain-drift]
description = "List possible new domain terms since the last domain-pass/* tag (advisory)"
run = "scripts/domain-drift.sh"

[tasks.light-build]
description = "Build the committed HEAD the way Light's release builder does (optional arg: SDK dir)"
run = "scripts/light-build.sh"

[settings]
# Only install what this repo pins; do not auto-install tools from parent directories
task.run_auto_install = false
exec_auto_install = false
